name: Deploy-Docker

on:
  push:
    branches: ["develop", "qa", "prod"]

jobs:
  Deploying-Docker-Image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_DEV }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Check authentication
        run: gcloud auth list

      - name: Build Docker Image
        run: docker build -t europe-west2-docker.pkg.dev/looply-loo-dev/Component-Library/looply-dev-image:${{ github.sha }} ./component-library

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west2-docker.pkg.dev --quiet

      - name: Push to Artifact Registry
        run: docker push europe-west2-docker.pkg.dev/looply-loo-dev/Component-Library/looply-dev-image:${{ github.sha }}
